<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruleta dels Exàmens d'Excel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f6fa;
            margin: 0;
        }
        h1 { color: #2f3542; margin-bottom: 20px; }
        .ruleta-container { position: relative; width: 500px; height: 500px; }
        .marcador {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent;
            border-top: 40px solid #ff4757; z-index: 10;
        }
        #canvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.25));
        }
        button {
            margin-top: 35px; padding: 15px 40px; font-size: 20px; font-weight: bold;
            color: white; background-color: #10ac84; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.15); transition: 0.2s;
        }
        button:hover { background-color: #1dd1a1; transform: scale(1.05); }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #resultat { margin-top: 25px; font-size: 24px; font-weight: bold; color: #2f3542; height: 35px; text-align: center; }
    </style>
</head>
<body>

    <h1>Sorteig d'Exàmens d'Excel 📊</h1>

    <div class="ruleta-container">
        <div class="marcador"></div>
        <canvas id="canvas" width="500" height="500"></canvas>
    </div>

    <button id="botó" onclick="girarRuleta()">Girar la Ruleta</button>

    <div id="resultat"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 220;

        const examens = [
            { nom: "1.2", color: "#ff6b6b" },
            { nom: "1.3", color: "#4bc0c0" },
            { nom: "1.4", color: "#ffcd56" },
            { nom: "1.5", color: "#4bc0c0" },
            { nom: "1.6", color: "#36a2eb" },
            { nom: "1.8", color: "#4bc0c0" },
            { nom: "1.9", color: "#9966ff" },
            { nom: "1.10", color: "#4bc0c0" },
            { nom: "1.11", color: "#ff9f40" },
            { nom: "1.12", color: "#4bc0c0" },
            { nom: "2.2", color: "#c9cbcf" },
            { nom: "3.4", color: "#ff6b6b" }
        ];

        let rotacio = 0;
        let trucat = false;
        let jaHaGirat = false;

        // Dibuixar la ruleta
        function dibuixarRuleta() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotacio);

            const anglePerSector = (Math.PI * 2) / examens.length;

            examens.forEach((examen, index) => {
                const startAngle = index * anglePerSector;
                const endAngle = (index + 1) * anglePerSector;

                // Dibuixar sector
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = examen.color;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Dibuixar text
                ctx.save();
                ctx.rotate(startAngle + anglePerSector / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#000";
                ctx.font = "bold 18px Arial";
                ctx.fillText("Excel " + examen.nom, radius - 30, 10);
                ctx.restore();
            });

            // Dibuixar cercle central
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fillStyle = "#2f3542";
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }

        // Soroll de ruleta realista
        function crearSonRuleta() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioContext.currentTime;

            // Crear soroll blanc (ruido blanco)
            const bufferSize = audioContext.sampleRate * 30;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                noiseData[i] = Math.random() * 2 - 1;
            }

            const noiseSource = audioContext.createBufferSource();
            noiseSource.buffer = noiseBuffer;

            // Filtro per fer el soroll més realista (baixar freqüències altes)
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, now);

            // Guany (volum)
            const gainNode = audioContext.createGain();
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 30);

            // Connectar nodes
            noiseSource.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            noiseSource.start(now);
            noiseSource.stop(now + 30);
        }

        // Tecla "T" per trucar
        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                trucat = true;
                console.log("Mode trucat ACTIVAT 😉");
            }
        });

        function girarRuleta() {
            if (jaHaGirat) return;
            jaHaGirat = true;

            const resultatElement = document.getElementById('resultat');
            const botó = document.getElementById('botó');

            botó.disabled = true;
            resultatElement.innerText = '';

            // Crear el soroll
            crearSonRuleta();

            let indexExamen;
            if (trucat) {
                indexExamen = 0; // Excel 1.2
            } else {
                indexExamen = Math.floor(Math.random() * examens.length);
            }

            const anglePerSector = (Math.PI * 2) / examens.length;
            const angleTarget = indexExamen * anglePerSector;
            const voltes = 10;
            const rotatioFinal = voltes * Math.PI * 2 + angleTarget;

            let startTime = null;
            const duration = 30000; // 30 segons

            function animar(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing: comença ràpid i acaba lent
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                rotacio = rotatioFinal * easeProgress;

                dibuixarRuleta();

                if (progress < 1) {
                    requestAnimationFrame(animar);
                } else {
                    resultatElement.innerText = `Ha tocat: Excel ${examens[indexExamen].nom} 🎯`;
                    botó.disabled = false;
                    jaHaGirat = false;
                    trucat = false;
                }
            }

            requestAnimationFrame(animar);
        }

        // Dibuixar ruleta inicial
        dibuixarRuleta();
    </script>

</body>
</html>
